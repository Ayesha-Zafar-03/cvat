<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVAT Class-Wise Analytics Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6em; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input, button { font-size: 16px; padding: 6px 10px; }
  input { width: 90px; }
  #status { padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-bottom: 16px; }
  .connected { background: #d4edda; color: #155724; }
  .disconnected { background: #f8d7da; color: #721c24; }
  .chart-box { position: relative; width: 100%; height: 50vh; min-height: 260px; }
  #totalCount { font-size: 1.1em; margin-top: 14px; }
  #empty { color: #555; margin-top: 10px; }
  @media (max-width: 480px) { h1 { font-size: 1.3em; } }
</style>
</head>
<body>
  <h1>Class-Wise Annotation Analytics</h1>
  <div class="controls">
    <label for="taskId">Task ID:</label>
    <input id="taskId" type="number" min="1" value="1">
    <button onclick="loadTask()">Load</button>
  </div>
  <div id="status" class="disconnected">Disconnected</div>
  <div class="chart-box"><canvas id="chart"></canvas></div>
  <div id="empty"></div>
  <div id="totalCount"></div>

<script>
let chart, ws, currentTaskId, retryTimer;

function setStatus(text, ok) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = ok ? 'connected' : 'disconnected';
}

function updateChart(data) {
  const names = Object.keys(data.class_counts);
  chart.data.labels = names;
  chart.data.datasets[0].data = names.map(n => data.class_counts[n].images);
  chart.data.datasets[1].data = names.map(n => data.class_counts[n].annotations);
  chart.update();
  document.getElementById('empty').textContent =
    names.length ? '' : 'No annotations in this task yet.';
  document.getElementById('totalCount').textContent =
    `Total annotations: ${data.total_annotations}`;
}

function closeSocket() {
  clearTimeout(retryTimer);
  if (ws) {
    ws.onclose = null;   // prevent the old socket from starting its own reconnect loop
    ws.onerror = null;
    ws.close();
    ws = null;
  }
}

function connectWebSocket(taskId) {
  closeSocket();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/test/tasks/${taskId}/class-counts/`);

  ws.onopen = () => setStatus('Connected - live updates active', true);
  ws.onmessage = (event) => updateChart(JSON.parse(event.data));
  ws.onclose = () => {
    setStatus('Disconnected - retrying in 3s...', false);
    retryTimer = setTimeout(() => connectWebSocket(taskId), 3000);
  };
  ws.onerror = () => ws.close();
}

async function loadTask() {
  const id = document.getElementById('taskId').value.trim();
  if (!/^\d+$/.test(id)) {
    setStatus('Please enter a valid numeric Task ID', false);
    return;
  }
  currentTaskId = id;
  closeSocket();
  try {
    const res = await fetch(`/api/test/tasks/${id}/class-counts/`, {
      headers: { 'Accept': 'application/vnd.cvat+json; version=2.0' },
      credentials: 'include'
    });
    if (res.status === 404) { setStatus(`Task ${id} not found`, false); return; }
    if (res.status === 401 || res.status === 403) { setStatus('Not logged in - log in to CVAT first', false); return; }
    if (!res.ok) { setStatus(`Error loading data: HTTP ${res.status}`, false); return; }
    updateChart(await res.json());
    connectWebSocket(id);
  } catch (err) {
    setStatus(`Error: ${err.message}`, false);
  }
}

window.onload = () => {
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: [],
      datasets: [
        { label: 'Images containing class', data: [], backgroundColor: '#f28e2b' },
        { label: 'Annotations', data: [], backgroundColor: '#4e79a7' }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
  loadTask();
};
</script>
</body>
</html>
